[package]
name = "home-assistant-provision"
version = "0.1.0"
edition = "2024"
description = "Declarative provisioning of Home Assistant"
license = "MIT"
repository = "https://github.com/Swarsel/home-assistant-provision"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
